<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b08" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DORK — A Scott Adventure</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="machine" aria-label="Dork game terminal">
    <div class="monitor-shell">
      <div class="brand-row">
        <span>DORK SYSTEMS</span>
        <span>EXPANDED EDITION · 2.0</span>
      </div>
      <section class="crt" id="crt">
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="screen-content">
          <div id="storageNotice" role="status" hidden></div>
          <div id="output" class="output" role="log" aria-live="polite" aria-relevant="additions" tabindex="0" aria-label="Game transcript"></div>
          <button id="newOutput" type="button" hidden>NEW OUTPUT ↓</button>
          <form id="commandForm" class="command-row" autocomplete="off">
            <label for="commandInput" aria-label="Command">&gt;</label>
            <input id="commandInput" type="text" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" aria-label="Type a command" />
            <button class="submit-command" type="submit" aria-label="Submit command">↵</button>
          </form>
        </div>
      </section>
      <div class="controls">
        <button data-command="look">LOOK</button>
        <button data-command="inventory">INV</button>
        <button data-command="north">N</button>
        <button data-command="south">S</button>
        <button data-command="east">E</button>
        <button data-command="west">W</button>
        <button data-command="hint">HINT</button>
        <button data-command="help">HELP</button>
      </div>
      <nav class="utility-controls" aria-label="Game tools">
        <button type="button" data-panel="map">MAP</button>
        <button type="button" data-panel="settings">TOOLS</button>
      </nav>
      <div class="statusline">
        <span id="runStatus">RUN 1</span>
        <span id="roomStatus">EXECUTIVE CONTINUITY REVIEW</span>
      </div>
    </div>
  </main>

  <dialog id="toolDialog" aria-labelledby="toolTitle">
    <header class="tool-header"><h2 id="toolTitle">TOOLS</h2><button type="button" data-close aria-label="Close panel">CLOSE</button></header>
    <div class="tool-body"></div>
  </dialog>
  <script src="engine-core.js"></script>
  <script src="game-data.js"></script>
  <script src="expansion-data.js"></script>
  <script src="world-content.js"></script>
  <script src="parser.js"></script>
  <script src="game-support.js"></script>
  <script src="interface.js"></script>
  <script src="expansion.js"></script>
  <script src="game.js"></script>
</body>
</html>
