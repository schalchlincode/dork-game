name: Validate Casebook removal

on:
  push:
    branches: [remove-casebook-keep-lore-2026-10-13]
    paths: ['.github/workflows/remove-casebook.yml']

permissions:
  contents: write

concurrency:
  group: dork-remove-casebook
  cancel-in-progress: false

jobs:
  revise:
    if: github.ref == 'refs/heads/remove-casebook-keep-lore-2026-10-13'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-checked revision
        run: |
          echo 'c785d167141102760799bf9f7d088b5ff282101d989c6c9d81be7421b41f3dc4  _delivery/remove_casebook.py' | sha256sum -c -
          git diff --exit-code 417f46f23711556a36d6da9e7bbbb8b1440e5421 -- '*.js' '*.html' '*.css' '*.md' 'tests/'
          python _delivery/remove_casebook.py
          mkdir -p test-results
          git diff --check
          node tests/core_test.js | tee test-results/core-invariants.txt
          find . -maxdepth 2 -name '*.js' -exec node --check {} \;
      - name: Install test browsers
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install --with-deps msedge chromium webkit
      - name: Original Edge regression
        run: python browser_test.py | tee test-results/original-regression.txt
      - name: Command equivalence and varied full route
        run: |
          python input_audit_matrix.py | tee test-results/equivalence.txt
          python input_audit_playthrough.py | tee test-results/varied-route.txt
      - name: Expanded Chromium and WebKit acceptance, including retained lore
        run: python tests/expanded_test.py | tee test-results/expanded-acceptance.txt
      - name: Commit only the tested revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm _delivery/remove_casebook.py .github/workflows/remove-casebook.yml
          git add CHANGELOG.md DESIGN.md EXPANDED_EDITION.md README.md SOLUTION.md casebook.js game-support.js expansion.js game.js index.html interface.js parser.js style.css tests/core_test.js tests/deployed_smoke.py tests/expanded_test.py
          git commit -m 'Remove Casebook entirely while preserving LORE and save compatibility'
          git push origin HEAD:remove-casebook-keep-lore-2026-10-13
          git rev-parse HEAD > test-results/validated-commit.txt
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: casebook-removal-evidence
          path: test-results/
          if-no-files-found: ignore
