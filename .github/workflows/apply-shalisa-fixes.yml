name: Apply Shalisa playtest fixes

on:
  push:
    branches:
      - shalisa-playtest-fixes-2026-10-12
    paths:
      - .github/apply_shalisa_fixes.py
      - .github/workflows/apply-shalisa-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: shalisa-playtest-fixes-2026-10-12
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply Shalisa playtest fixes
        run: python .github/apply_shalisa_fixes.py

      - name: Normalize generated files
        run: |
          python - <<'PY'
          from pathlib import Path

          game = Path('game.js')
          game_text = game.read_text(encoding='utf-8')
          game_text = game_text.replace("Procurement's", "Procurement\\'s")
          game.write_text(game_text, encoding='utf-8')

          tests = Path('browser_test.py')
          test_text = tests.read_text(encoding='utf-8')
          old = '            assert "There is nothing portable left" in (await page.locator("#output").inner_text())[-500:]'
          new = '            assert "waiver_form" in await page.evaluate("JSON.parse(localStorage.dork_run_v1).inventory")'
          if old not in test_text:
              raise SystemExit('Expected legal-annex take-all assertion was not found')
          tests.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        run: node --check game.js

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps msedge

      - name: Run full browser regression
        run: python browser_test.py

      - name: Commit verified changes
        run: |
          rm .github/apply_shalisa_fixes.py
          rm .github/workflows/apply-shalisa-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Shalisa playtest revisions"
          git push origin HEAD:shalisa-playtest-fixes-2026-10-12
