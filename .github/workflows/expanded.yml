name: Expanded edition validation

on:
  push:
    branches: [dork-expanded-edition-2026-10-13, main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package playable source
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('/tmp/dork-expanded.zip', 'w', ZIP_DEFLATED) as archive:
              for path in sorted(Path('.').rglob('*')):
                  if path.is_file() and '.git' not in path.parts and '__pycache__' not in path.parts:
                      archive.write(path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dork-playable-source
          path: /tmp/dork-expanded.zip
      - name: Validate JavaScript
        run: find . -maxdepth 2 -name '*.js' -not -path './node_modules/*' -exec node --check {} \;
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps msedge chromium webkit
      - name: Original browser regression
        run: python browser_test.py
      - name: Expanded edition regression
        run: |
          if test -f tests/expanded_test.py; then python tests/expanded_test.py; fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dork-test-evidence
          path: test-results/
          if-no-files-found: ignore
