name: Apply blind playtest fixes

on:
  push:
    branches:
      - playtest-fixes-2026-10-11
    paths:
      - .github/apply_playtest_fixes.py
      - .github/workflows/apply-playtest-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: playtest-fixes-2026-10-11
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply playtest fixes
        run: python .github/apply_playtest_fixes.py

      - name: Validate JavaScript syntax
        run: node --check game.js

      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps msedge

      - name: Run full browser regression
        run: python browser_test.py

      - name: Commit verified changes
        run: |
          rm .github/apply_playtest_fixes.py
          rm .github/workflows/apply-playtest-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement blind playtest improvements"
          git push origin HEAD:playtest-fixes-2026-10-11
