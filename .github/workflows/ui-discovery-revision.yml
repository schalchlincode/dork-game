name: Validate discovery-focused UI revision

on:
  push:
    branches: [remove-pack-spoiler-free-help-2026-10-13]
    paths: ['.github/workflows/ui-discovery-revision.yml']

permissions:
  contents: write

concurrency:
  group: dork-ui-discovery-revision
  cancel-in-progress: false

jobs:
  revise:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-checked revision
        run: python _maintenance/apply_ui_revision.py
      - name: JavaScript syntax and engine invariants
        run: |
          for file in *.js; do node --check "$file"; done
          node tests/core_test.js
      - name: Install browser tests
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m playwright install --with-deps msedge chromium webkit
      - name: Original Edge regression
        run: python browser_test.py
      - name: Command equivalence and varied-input route
        run: |
          python input_audit_matrix.py
          python input_audit_playthrough.py
      - name: Complete Chromium and WebKit acceptance
        run: python tests/expanded_test.py
      - name: Commit only the validated revision
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md DESIGN.md EXPANDED_EDITION.md README.md game.js index.html interface.js style.css tests/expanded_test.py
          git rm _maintenance/apply_ui_revision.py .github/workflows/ui-discovery-revision.yml
          git commit -m 'Remove PACK and environmental completion; keep HELP free of puzzle spoilers'
          git push origin HEAD:remove-pack-spoiler-free-help-2026-10-13
          git rev-parse HEAD > test-results/validated-commit.txt
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-ui-evidence
          path: test-results/
          if-no-files-found: ignore
